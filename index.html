<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inauguratie Countdown</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Segoe UI", Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );

    color: white;
}

.container {
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 4rem;
    margin-bottom: 10px;
    font-weight: 700;
}

.subtitle {
    font-size: 1.2rem;
    color: #94a3b8;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

.date {
    color: #64748b;
    margin-bottom: 50px;
    font-size: 1rem;
}

.clock {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.box {
    width: 160px;
    background: #111827;
    border-radius: 18px;
    padding: 25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.08);
}

.number {
    font-size: 4rem;
    font-weight: bold;
    transition: transform 0.2s ease;
}

.flip {
    animation: flipAnimation 0.4s ease;
}

@keyframes flipAnimation {

    0% {
        transform: rotateX(0deg);
    }

    50% {
        transform: rotateX(90deg);
    }

    100% {
        transform: rotateX(0deg);
    }

}

.label {
    margin-top: 12px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 2px;
}

@media (max-width:768px) {

    h1 {
        font-size: 2rem;
    }

    .subtitle {
        letter-spacing: 2px;
    }

    .box {
        width: 110px;
        padding: 15px;
    }

    .number {
        font-size: 2.2rem;
    }
}

</style>

</head>
<body>

<div class="container">

    <h1>Inauguratie Countdown</h1>

    <div class="subtitle">
        EVO 321
    </div>

    <div class="date">
        17 december 2026 - 08:00
    </div>

    <div class="clock">

        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Dagen</div>
        </div>

        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Uren</div>
        </div>

        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Minuten</div>
        </div>

        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Seconden</div>
        </div>

    </div>

</div>

<script>

const targetDate = new Date(2026, 11, 17, 8, 0, 0);

function updateNumber(id, value) {

    const element = document.getElementById(id);
    const newValue = String(value);

    if (element.textContent !== newValue) {

        element.classList.add("flip");

        setTimeout(() => {
            element.textContent = newValue;
        }, 150);

        setTimeout(() => {
            element.classList.remove("flip");
        }, 400);

    }
}

function updateCountdown() {

    const now = new Date();

    const diff = targetDate.getTime() - now.getTime();

    if (diff <= 0) {

        document.querySelector(".container").innerHTML =
            "<h1>Inauguratie gestart</h1>";

        return;
    }

    const days =
        Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours =
        Math.floor((diff / (1000 * 60 * 60)) % 24);

    const minutes =
        Math.floor((diff / (1000 * 60)) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);

    updateNumber("days", days);
    updateNumber("hours", String(hours).padStart(2, "0"));
    updateNumber("minutes", String(minutes).padStart(2, "0"));
    updateNumber("seconds", String(seconds).padStart(2, "0"));
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inauguratie Countdown</title>

<style>
.number {
    font-size: 4rem;
    font-weight: bold;
    transition: transform 0.3s ease;
}

.flip {
    animation: flip 0.4s ease;
}

@keyframes flip {

    0% {
        transform: rotateX(0deg);
    }

    50% {
        transform: rotateX(90deg);
    }

    100% {
        transform: rotateX(0deg);
    }

}
</style>

</head>
<body>

<div class="container">

    <h1>Inauguratie Countdown</h1>

    <div class="subtitle">
        EVO 321
    </div>

    <div class="date">
        17 december 2026 - 08:00
    </div>

    <div class="clock">

        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Dagen</div>
        </div>

        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Uren</div>
        </div>

        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Minuten</div>
        </div>

        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Seconden</div>
        </div>

    </div>

</div>

<script>

const targetDate = new Date(2026, 11, 17, 8, 0, 0);

function updateCountdown() {

    const now = new Date();

    const diff = targetDate.getTime() - now.getTime();

    if (diff <= 0) {

        document.querySelector(".container").innerHTML =
            "<h1>Inauguratie gestart</h1>";

        return;
    }

    const days =
        Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours =
        Math.floor((diff / (1000 * 60 * 60)) % 24);

    const minutes =
        Math.floor((diff / (1000 * 60)) % 60);

    const seconds =
        Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent =
        days;

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
``

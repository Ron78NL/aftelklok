<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inauguratie Countdown</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    max-width: 1200px;
    padding: 20px;
}

h1 {
    font-size: 4rem;
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

.date {
    color: #64748b;
    margin-bottom: 40px;
}

.clock {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.box {
    background: #111827;
    border-radius: 16px;
    padding: 25px;
    width: 160px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);
}

.number {
    font-size: 4rem;
    font-weight: bold;
}

.label {
    margin-top: 10px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 2px;
}

@media (max-width: 768px) {

    h1 {
        font-size: 2rem;
    }

    .box {
        width: 110px;
        padding: 15px;
    }

    .number {
        font-size: 2.2rem;
    }
}

</style>

</head>
<body>

<div class="container">

    <h1>Inauguratie Countdown</h1>

    <div class="subtitle">
        EVO 321
    </div>

    <div class="date">
        17 december 2026 - 08:00
    </div>

    <div class="clock">

        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Dagen</div>
        </div>

        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Uren</div>
        </div>

        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Minuten</div>
        </div>

        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Seconden</div>
        </div>

    </div>

</div>

<script>

const targetDate = new Date(2026, 11, 17, 8, 0, 0);

function updateCountdown() {

    const now = new Date();
    const diff = targetDate.getTime() - now.getTime();

    if (diff <= 0) {

        document.querySelector(".container").innerHTML =
            "<h1>Inauguratie gestart</h1>";

        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (diff / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (diff / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (diff / 1000) % 60
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
